<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Feiticeira Vip - Portal Oficial de Apostas Online e Jogo do Bicho</title>

  <meta
    name="description"
    content="Feiticeira VIP - Oficial Plataforma de apostas online, com palpites, jogos, informações e entretenimento. Acesso rápido, prático e seguro."
  >

  <link rel="icon" type="image/png" href="feiticeira.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* SITE PRINCIPAL */

    .site-frame {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
      display: block;
    }

    /* BANNER DE ENTRADA */

    .banner-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, 0.65);
      padding: 20px;
    }

    .banner {
      position: relative;

      width: min(900px, 95vw);
      max-height: 85vh;
      max-height: 85dvh;

      background: #fff;
      border-radius: 12px;
      overflow: hidden;

      box-shadow: 0 10px 50px rgba(0, 0, 0, 0.45);
    }

    .banner-image {
      display: block;

      width: 100%;
      height: auto;
      max-height: 85vh;
      max-height: 85dvh;

      object-fit: contain;
    }

    .banner-link {
      position: absolute;
      inset: 0;

      z-index: 10001;
      cursor: pointer;
    }

    .banner-close {
      position: absolute;
      top: 8px;
      right: 8px;

      width: 34px;
      height: 34px;

      border: 0;
      border-radius: 50%;

      background: rgba(0, 0, 0, 0.75);
      color: #fff;

      font-size: 24px;
      line-height: 34px;

      cursor: pointer;
      z-index: 10002;
    }

    .banner-close:hover {
      background: #000;
    }

    /* GRUPO DE PALPITES */

    .whatsapp-box {
      position: fixed;
      left: 20px;
      bottom: 20px;

      width: 280px;
      min-height: 120px;

      padding: 22px 20px 20px;

      background: #fff;
      border-radius: 14px;

      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.25);

      z-index: 9999;

      cursor: pointer;
      font-family: Arial, sans-serif;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .whatsapp-box:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.30);
    }

    .close-button {
      position: absolute;
      top: 6px;
      right: 8px;

      width: 26px;
      height: 26px;

      border: none;
      background: transparent;

      color: #777;
      font-size: 20px;
      line-height: 26px;

      cursor: pointer;
      z-index: 2;
    }

    .close-button:hover {
      color: #000;
    }

    .whatsapp-title {
      margin: 8px 0;

      color: #111;
      font-size: 20px;
      font-weight: 700;
    }

    .whatsapp-text {
      margin: 0;

      color: #555;
      font-size: 14px;
      line-height: 1.4;
    }

    .whatsapp-button {
      display: inline-block;

      margin-top: 12px;
      padding: 9px 16px;

      background: #25D366;
      color: #fff;

      border-radius: 8px;

      font-size: 14px;
      font-weight: 700;
    }

    /* FERRAMENTA DE PUXADA */

    .puxada-box {
      position: fixed;

      right: 20px;
      bottom: 20px;

      width: 300px;

      background: #fff;
      border-radius: 14px;

      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.30);

      z-index: 9998;
      font-family: Arial, sans-serif;

      overflow: hidden;
    }

    .puxada-header {
      position: relative;

      padding: 15px 45px 15px 18px;

      background: #111;
      color: #fff;

      font-size: 18px;
      font-weight: 700;
    }

    .puxada-close {
      position: absolute;

      top: 7px;
      right: 8px;

      width: 30px;
      height: 30px;

      border: 0;
      background: transparent;

      color: #fff;
      font-size: 23px;

      cursor: pointer;
    }

    .puxada-close:hover {
      color: #ccc;
    }

    .puxada-content {
      padding: 15px;
    }

    .puxada-search {
      position: relative;

      display: flex;
      align-items: center;
    }

    .puxada-search input {
      width: 100%;
      height: 44px;

      padding: 0 45px 0 13px;

      border: 1px solid #ddd;
      border-radius: 9px;

      outline: none;
      font-size: 15px;
    }

    .puxada-search input:focus {
      border-color: #111;
    }

    .search-icon {
      position: absolute;
      right: 13px;

      color: #555;
      font-size: 20px;

      pointer-events: none;
    }

    .puxada-resultados {
      margin-top: 15px;

      max-height: 250px;
      overflow-y: auto;
    }

    .resultado-titulo {
      margin-bottom: 10px;

      color: #222;
      font-size: 14px;
      font-weight: 700;
    }

    .animal-result {
      display: inline-block;

      margin: 4px 3px;
      padding: 8px 11px;

      background: #f1f1f1;
      color: #222;

      border-radius: 8px;

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .animal-result:hover {
      background: #111;
      color: #fff;
    }

    .sem-resultado {
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }

    /* AJUSTES PARA CELULAR */

    @media (max-width: 600px) {
      .banner-overlay {
        padding: 10px;
      }

      .banner {
        width: 96vw;
        max-height: 75vh;
        max-height: 75dvh;
      }

      .banner-image {
        max-height: 75vh;
        max-height: 75dvh;
      }

      .whatsapp-box {
        left: 12px;
        right: 12px;
        bottom: 12px;

        width: auto;
      }

      .puxada-box {
        right: 12px;
        bottom: 12px;

        width: 290px;
        max-width: calc(100vw - 24px);

        max-height: 45vh;
        max-height: 45dvh;
        overflow-y: auto;
      }

      .puxada-resultados {
        max-height: 180px;
      }
    }
  </style>
</head>

<body>

  <!-- SITE PRINCIPAL COM PERMISSÕES DE ÁREA DE TRANSFERÊNCIA -->

  <iframe
    class="site-frame"
    src="https://app.feiticeira.club/pr/2iCVbLKr"
    title="Plataforma Feiticeira"
    allow="clipboard-read; clipboard-write; fullscreen"
    allowfullscreen>
  </iframe>

  <!-- BANNER DE ENTRADA -->

  <div
    class="banner-overlay"
    id="bannerOverlay">

    <div class="banner">

      <img
        class="banner-image"
        src="aguianovo.png"
        alt="Banca Águia">

      <a
        class="banner-link"
        href="https://bancaaguiaoficial.com.br/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Acessar Banca Águia">
      </a>

      <button
        type="button"
        class="banner-close"
        id="bannerClose"
        aria-label="Fechar banner">
        ×
      </button>

    </div>
  </div>

  <!-- GRUPO DE PALPITES -->

  <div
    class="whatsapp-box"
    id="whatsappBox"
    onclick="abrirWhatsApp(event)">

    <button
      type="button"
      class="close-button"
      onclick="fecharInformativo(event)"
      aria-label="Fechar">
      ×
    </button>

    <div class="whatsapp-title">
      Grupo de palpites
    </div>

    <p class="whatsapp-text">
      Entre no nosso grupo do WhatsApp e acompanhe os palpites.
    </p>

    <div class="whatsapp-button">
      Entrar no grupo
    </div>
  </div>

  <!-- FERRAMENTA DE PUXADA -->

  <div
    class="puxada-box"
    id="puxadaBox">

    <div class="puxada-header">

      PUXADA

      <button
        type="button"
        class="puxada-close"
        onclick="fecharPuxada(event)"
        aria-label="Fechar Puxada">
        ×
      </button>

    </div>

    <div class="puxada-content">

      <div class="puxada-search">

        <input
          type="text"
          id="animalInput"
          placeholder="Digite o nome de um animal..."
          autocomplete="off">

        <span class="search-icon">
          🔍
        </span>

      </div>

      <div
        class="puxada-resultados"
        id="resultados">

        <div class="sem-resultado">
          Digite um animal para consultar suas opções.
        </div>

      </div>
    </div>
  </div>

  <script>
    /* FECHAR BANNER */

    document
      .getElementById("bannerClose")
      .addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        document
          .getElementById("bannerOverlay")
          .style.display = "none";
      });

    /* WHATSAPP */

    const whatsappLink =
      "https://chat.whatsapp.com/CaY60otbPRkEJL0n5Hhnvm";

    function abrirWhatsApp(event) {
      if (event.target.closest(".close-button")) {
        return;
      }

      window.location.href = whatsappLink;
    }

    function fecharInformativo(event) {
      event.stopPropagation();

      document
        .getElementById("whatsappBox")
        .style.display = "none";
    }

    /* DADOS DA FERRAMENTA DE PUXADA */

    const animais = {

      "avestuz": [
        "Vaca",
        "Águia",
        "Galo",
        "Pavão",
        "Peru"
      ],

      "águia": [
        "Coelho",
        "Avestruz",
        "Galo",
        "Pavão",
        "Peru"
      ],

      "burro": [
        "Cavalo",
        "Elefante",
        "Touro",
        "Veado",
        "Coelho",
        "Cobra"
      ],

      "borboleta": [
        "Cabra",
        "Elefante",
        "Gato",
        "Leão",
        "Cachorro",
        "Galo"
      ],

      "cachorro": [
        "Galo",
        "Gato",
        "Camelo",
        "Macaco",
        "Porco",
        "Pavão"
      ],

      "cabra": [
        "Carneiro",
        "Macaco",
        "Elefante",
        "Touro",
        "Tigre",
        "Urso"
      ],

      "carneiro": [
        "Cabra",
        "Coelho",
        "Vaca"
      ],

      "camelo": [
        "Cachorro",
        "Elefante",
        "Urso"
      ],

      "cobra": [
        "Jacaré",
        "Porco",
        "Burro",
        "Gato"
      ],

      "coelho": [
        "Carneiro",
        "Águia",
        "Burro"
      ],

      "cavalo": [
        "Burro",
        "Cabra",
        "Touro"
      ],

      "elefante": [
        "Cabra",
        "Urso",
        "Tigre",
        "Leão",
        "Burro"
      ],

      "galo": [
        "Cachorro",
        "Avestruz",
        "Águia",
        "Pavão",
        "Peru"
      ],

      "gato": [
        "Cachorro",
        "Leão",
        "Tigre",
        "Cobra"
      ],

      "jacaré": [
        "Cobra",
        "Porco",
        "Borboleta",
        "Macaco"
      ],

      "leão": [
        "Elefante",
        "Gato",
        "Tigre",
        "Urso"
      ],

      "macaco": [
        "Cachorro",
        "Cabra",
        "Peru",
        "Jacaré"
      ],

      "porco": [
        "Cobra",
        "Peru",
        "Jacaré",
        "Cachorro"
      ],

      "pavão": [
        "Avestruz",
        "Águia",
        "Galo",
        "Peru"
      ],

      "peru": [
        "Avestruz",
        "Águia",
        "Galo",
        "Pavão",
        "Veado"
      ],

      "touro": [
        "Vaca",
        "Burro",
        "Cabra"
      ],

      "tigre": [
        "Gato",
        "Leão",
        "Cabra"
      ],

      "urso": [
        "Leão",
        "Elefante",
        "Camelo",
        "Cabra"
      ],

      "veado": [
        "Peru",
        "Burro",
        "Cabra"
      ],

      "vaca": [
        "Touro",
        "Avestruz",
        "Carneiro"
      ]
    };

    /* NORMALIZAR TEXTO */

    function normalizarTexto(texto) {
      return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }

    /* PESQUISA DE ANIMAIS */

    const animalInput =
      document.getElementById("animalInput");

    const resultados =
      document.getElementById("resultados");

    animalInput.addEventListener("input", function() {

      const busca =
        normalizarTexto(this.value);

      resultados.innerHTML = "";

      if (!busca) {
        resultados.innerHTML = `
          <div class="sem-resultado">
            Digite um animal para consultar suas opções.
          </div>
        `;

        return;
      }

      const animalEncontrado =
        Object.keys(animais).find(animal => {
          return normalizarTexto(animal) === busca;
        });

      if (!animalEncontrado) {

        const sugestoes =
          Object.keys(animais).filter(animal => {
            return normalizarTexto(animal)
              .includes(busca);
          });

        if (sugestoes.length > 0) {

          resultados.innerHTML = `
            <div class="resultado-titulo">
              Você quis dizer:
            </div>
          `;

          sugestoes.forEach(animal => {

            const item =
              document.createElement("span");

            item.className = "animal-result";

            item.textContent =
              animal.charAt(0).toUpperCase()
              + animal.slice(1);

            item.onclick = function() {
              animalInput.value = animal;
              mostrarResultados(animal);
            };

            resultados.appendChild(item);
          });

          return;
        }

        resultados.innerHTML = `
          <div class="sem-resultado">
            Animal não encontrado.
          </div>
        `;

        return;
      }

      mostrarResultados(animalEncontrado);
    });

    /* MOSTRAR RESULTADOS */

    function mostrarResultados(animal) {

      resultados.innerHTML = `
        <div class="resultado-titulo">
          Opções para ${
            animal.charAt(0).toUpperCase() + animal.slice(1)
          }:
        </div>
      `;

      animais[animal].forEach(opcao => {

        const item =
          document.createElement("span");

        item.className = "animal-result";
        item.textContent = opcao;

        resultados.appendChild(item);
      });
    }

    /* FECHAR FERRAMENTA DE PUXADA */

    function fecharPuxada(event) {
      event.stopPropagation();

      document
        .getElementById("puxadaBox")
        .style.display = "none";
    }
  </script>

</body>
</html>
